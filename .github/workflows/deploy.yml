name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main, master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Must be >=22: wrangler, miniflare and @opennextjs require Node 22+.
          # Building on Node 20 produces a subtly broken worker bundle whose app-router
          # page module loses its `handler` export (HTTP 500: ComponentMod.handler is
          # not a function on every route).
          node-version: 22
          cache: npm

      - run: npm ci

      # THE SUITE RUNS BEFORE PRODUCTION DEPLOYS, and it did not until 2026-08-30.
      #
      # Every deploy before that was gated on whoever pushed having remembered to run the tests on
      # their own machine. That is not a gate, it is a habit, and it is a large part of why shipping
      # a feature here has felt like handling a bomb: the only thing standing between a regression
      # and a customer was someone's memory.
      #
      # A red test now stops the deploy. If a genuine emergency ever needs to bypass it, that should
      # be a deliberate act — comment this out in a commit, so the bypass is in the history — rather
      # than something that quietly never ran.
      - run: npm test

      # A HOOK AFTER AN EARLY RETURN CRASHES A PAGE, and nothing above catches it.
      #
      # On 2026-09-02 a guest unlocking a password-protected album got "Something went wrong"
      # instead of the album: five useMemo calls sat below an early return in AlbumPageClient, so
      # the gated first render called five fewer hooks and React threw #310 the moment the album
      # arrived. Types passed, 1,100 tests passed, two adversarial rounds missed it — and
      # react-hooks/rules-of-hooks named all five in one run. The rule was installed the whole
      # time and nothing ever ran it, because this workflow lints nothing.
      #
      # Deliberately narrow: `npm run lint` still reports ~80 other react-hooks findings, and a
      # gate that fails on all of them is a gate somebody disables. This one fails only on the
      # class that takes a page down for a customer.
      - run: npm run check:hooks

      - name: Build for Cloudflare
        run: npm run cf:build
        env:
          NEXT_PUBLIC_SITE_URL: "https://hushare.space"
          NEXT_PUBLIC_SUPABASE_URL: "https://yqngmyjquwemwogdyuwv.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "sb_publishable_eGkedNMc2vozQFQz__XC5Q_ITLIHjKV"
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: "0x4AAAAAADDt-NIV2H4_FNKgornAUjbhM0g"

      # Keep the database in sync with the code on every deploy. Applies any new
      # supabase/migrations/*.sql (tracked + idempotent) then verifies no drift.
      # Skips gracefully if SUPABASE_DB_URL isn't set, so it can never block a deploy.
      # Set the secret to the Supabase pooler "session" connection string.
      - name: Apply DB migrations (if configured)
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            # Each guarded EXPLICITLY. These used to be `migrate && check` with the drift line
            # after them — so a failed migration skipped the check, fell through to the drift
            # line whose `|| echo` always succeeds, and the JOB WENT GREEN. The 2026-08-31
            # media_type index migration failed on a real deploy exactly this way, with a red
            # line in a collapsed log nobody opens. Code that needs a migration that silently
            # did not apply breaks in production, so this failure must be the deploy's failure.
            npm run db:migrate || { echo '::error::db:migrate FAILED - the code is about to deploy against a database it does not match'; exit 1; }
            npm run db:check || { echo '::error::db:check FAILED - live schema is missing something the code requires'; exit 1; }
            # The dumper's --check mode existed and nothing ever ran it, so schema.sql could drift
            # from the live database indefinitely — which is how it came to be missing every
            # foreign key without anyone noticing. Raised from ::warning:: to ::error:: after an
            # audit pointed out that an annotation on a passing build is precisely the signal
            # everyone learns to scroll past. It still does not fail the JOB — a stale recovery
            # file must never block shipping a fix during an incident — but it is now red.
            node scripts/dump-schema.mjs --check || echo '::error::schema.sql has drifted from the live database — run node scripts/dump-schema.mjs and commit it. The recovery file is stale.'
            # THIS ONE FAILS THE JOB, unlike the line above, and the difference is what each file is
            # for. schema.sql is a RECOVERY artifact: stale, it costs a bad afternoon after a
            # disaster, and blocking a deploy on it would block shipping a fix during an incident.
            # src/types/database.ts is LOAD-BEARING AT RUNTIME: if it claims a column that was
            # dropped, the code compiles, the query returns nothing, and a guest sees an empty album
            # at an event. That is the same class as db:check, which already exits 1.
            #
            # Note the ordering — db:migrate ran above, so this compares the committed types against
            # a database that already has this push's migrations. A developer cannot write code
            # against a column their types do not have, so regenerating is already the workflow.
            # Exit 2 means it could not CONNECT; exit 1 means it compared and found drift. Telling
            # them apart matters because the message is read by somebody shipping a fix, and
            # "regenerate the types" is the wrong instruction when the file is already correct and
            # the pooler simply blinked. Either way the job stops — db:migrate above hits the same
            # pooler and already exits 1 — but it stops saying something true.
            node scripts/gen-db-types.mjs --check
            case $? in
              0) ;;
              2) echo '::error::Could not reach the database to verify src/types/database.ts. This is NOT a drift failure — the file may be correct. Re-run the deploy.'; exit 1 ;;
              *) echo '::error::src/types/database.ts has drifted from the live database. Run npm run db:types and commit it — every type guarantee in this build is void until you do.'; exit 1 ;;
            esac
          else
            echo "::warning::SUPABASE_DB_URL secret not set — skipping DB migration + drift check"
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Deploy via Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
