# Nightly database backup.
#
# Supabase's free plan takes no backups at all, and until this existed the only copies were whatever
# had been made by hand on one laptop. The media lives in R2 and Stream; Postgres holds the rows
# that give it meaning, so losing it loses every album without losing a single photo.
#
# Runs on a schedule only. No push trigger: a backup should happen because time passed, not because
# somebody edited a file.
name: Nightly database backup

on:
  schedule:
    # 03:15 UTC daily. Deliberately not on the hour — GitHub's scheduler is busiest exactly then,
    # and a queued run can be delayed by many minutes or dropped entirely.
    - cron: '15 3 * * *'
  # So it can be proven to work without waiting a day.
  workflow_dispatch:

# Least privilege: this job reads the database and writes to R2. It has no business touching the
# repository, and on a PUBLIC repo a token with write access is a much larger prize than the code.
permissions:
  contents: read

concurrency:
  # Never let two backups overlap — the second would upload a dump the first was still pruning
  # against, and the retention count would be computed from a moving target.
  group: nightly-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The dump and upload scripts need `pg` and the S3 client, both already dependencies.
      - run: npm ci

      - name: Dump the database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup-db.mjs

      # CHECKED BEFORE THE DUMP, not after it.
      #
      # On 2026-08-25 and 2026-08-26 this job "ran" and failed, and nobody noticed for two days.
      # The dump succeeded, so the log looked like work was happening; the upload then exited
      # because the R2 secrets were never set on the repository, and the dump went in the bin with
      # the runner. Two nights of believing there was a backup, with none.
      #
      # Failing on the FIRST step names the actual problem in the first ten seconds of the log
      # instead of at the last line, and it does not waste a database dump to tell you.
      #
      # R2_BACKUP_BUCKET IS CHECKED HERE FOR A SECOND INCIDENT, not the one above.
      #
      # It was passed to the upload step but never actually set as a repository secret, and the
      # script used to fall back to the PUBLIC media bucket when it was missing. Ten nightly dumps
      # -- every owner token and album password hash -- were served at an unauthenticated,
      # date-stamped URL until 2026-09-04. The job was green every one of those nights.
      #
      # A missing secret that changes WHERE customer data is written has to be as fatal as a
      # missing credential, because the failure it causes is silent and the success looks identical.
      - name: Check the secrets exist before doing any work
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
        run: |
          missing=""
          for name in SUPABASE_DB_URL CLOUDFLARE_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BACKUP_BUCKET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Nightly backup cannot run. Missing repository secret(s):$missing"
            echo "Set them under Settings -> Secrets and variables -> Actions."
            echo "Until they are set there is NO off-machine copy of the database."
            exit 1
          fi
          # A dump must never land in the bucket published at R2_PUBLIC_HOST. The upload script
          # checks this too, and proves it with a real unauthenticated request after uploading;
          # this copy just fails ten seconds earlier and before a dump is made.
          if [ "$R2_BACKUP_BUCKET" = "hushare-media" ]; then
            echo "::error::R2_BACKUP_BUCKET is the PUBLIC media bucket. A dump holds every owner token and password hash."
            exit 1
          fi
          echo "All five secrets are present, and the backup bucket is not the public one."

      - name: Upload to R2 and prune old copies
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BACKUP_BUCKET: ${{ secrets.R2_BACKUP_BUCKET }}
          # Also needed here now: a successful upload records a heartbeat the admin dashboard reads,
          # so a silent failure shows up somewhere the owner actually looks.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/backup-upload.mjs

      # DELIBERATELY no actions/upload-artifact step. Artifacts on a public repository can be
      # downloaded by anyone, and a dump contains every owner token and album password hash — it
      # would publish precisely what this job exists to protect. The copy in R2 is the copy.
