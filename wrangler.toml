name = "hushare"
main = "worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

[[routes]]
pattern = "hushare.space/*"
zone_name = "hushare.space"

[[routes]]
pattern = "www.hushare.space/*"
zone_name = "hushare.space"

[triggers]
# Daily housekeeping, the every-minute sweep, and — every three hours — reclaiming the Cloudflare
# Stream quota held by abandoned uploads. See worker.ts for what runs on which.
crons = ["0 2 * * *", "* * * * *", "0 */3 * * *"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[[r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "hushare-media"

# Workers Analytics Engine — product event stream (queried via the SQL API / GraphQL).
# Fire-and-forget writes from src/lib/analytics.ts; never on the request's critical path.
# Dataset name matches the one created in the Cloudflare dashboard (case-sensitive).
[[analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "Hushare_events"

# Edge-enforced, no-DB-round-trip rate limit for the video-upload relay's PATCH path (src/app/api/
# upload/stream-relay/[uid]/route.ts). A relayed large video is many chunks (~820 for a 4GB video at
# 5MB/chunk) — the Postgres-backed checkRateLimit helper (insert+count+delete per call) would add
# real latency at that frequency, on the very networks already struggling. This binding is an abuse
# backstop only (the uid is already unguessable + existence-checked against our own DB), not a
# precise accounting mechanism — "eventually consistent per Cloudflare location" is fine for that.
[[ratelimits]]
name = "STREAM_RELAY_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 600
  period = 60

# Cloudflare Workers AI — powers the on-site AI support chat (src/app/api/support/chat/route.ts).
# No external API key: the model runs on Cloudflare's network, billed per-token at Workers AI rates.
[ai]
binding = "AI"

# Edge rate limit for the support chat (abuse / cost backstop). Generous so a venue's shared IP with
# many guests asking questions isn't throttled, but a single spammer hammering the model is stopped.
[[ratelimits]]
name = "SUPPORT_CHAT_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 100
  period = 60

[vars]
NEXT_PUBLIC_SITE_URL = "https://hushare.space"
NEXT_PUBLIC_SUPABASE_URL = "https://yqngmyjquwemwogdyuwv.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "sb_publishable_eGkedNMc2vozQFQz__XC5Q_ITLIHjKV"
R2_PUBLIC_HOST = "videos.hushare.space"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "0x4AAAAAADDt-NIV2H4_FNKgornAUjbhM0g"
# Set to "true" after verifying hushare.space in Resend dashboard → Domains
RESEND_DOMAIN_VERIFIED = "true"
# Secrets — set via: wrangler secret put <NAME>
# SUPABASE_SERVICE_ROLE_KEY
# SUPABASE_AUTH_HOOK_SECRET
# CLOUDFLARE_ACCOUNT_ID
# CLOUDFLARE_STREAM_TOKEN
# R2_ACCESS_KEY_ID
# R2_SECRET_ACCESS_KEY
# ALBUM_PASSWORD_PEPPER          (32+ random base64 bytes — NEVER change once users exist)
# ALBUM_PASSWORD_PEPPER_PREVIOUS (only needed during pepper rotation)
# ALBUM_RETIREMENT_SECRET        (32+ chars)
# RESEND_API_KEY
# TURNSTILE_SECRET_KEY           (Cloudflare Turnstile → your site → Secret key)
# POLAR_API_KEY
# POLAR_WEBHOOK_SECRET
# POLAR_PRODUCT_PRO_MONTHLY
# POLAR_PRODUCT_PRO_YEARLY
# POLAR_PRODUCT_STUDIO_MONTHLY
# POLAR_PRODUCT_STUDIO_YEARLY
# ADMIN_EMAILS                   (comma-separated emails)
# ERROR_ALERT_EMAIL              (where the error-spike alarm is sent — /api/cron/error-alert.
#                                 Unset means the cron returns ok+skipped every minute and the
#                                 alarm is silently off. "Send a test alert" on /admin proves it.)
# AWS_ACCESS_KEY_ID              (Rekognition — Studio tier face search)
# AWS_SECRET_ACCESS_KEY          (Rekognition)
# AWS_REGION                     (defaults to eu-west-1)

# ─── STAGING ──────────────────────────────────────────────────────────────────────────────────────
#
# A second, complete copy of Hushare: its own database, its own bucket, its own domain. It exists so
# a change can be broken on purpose — a migration replayed, an album mass-deleted, a load test run
# at 5,000 photos — without any of that reaching a customer.
#
# WRANGLER ENVIRONMENTS DO NOT INHERIT BINDINGS. Every binding below is redeclared on purpose, and
# that is a safety property rather than a chore: there is no way to add a production binding at the
# top of this file and have staging silently pick it up. Each one has to be written out and pointed
# somewhere of its own.
#
# The dangerous mistake this cannot prevent by itself is a staging deploy still holding production's
# Supabase URL — that does not error, it just quietly works against real albums. So the worker also
# refuses to open a privileged database client when HUSHARE_ENV=staging and any production resource
# is reachable. See src/lib/server/environment.ts and tests/environment-isolation.test.ts.
#
# Deploy with:  npx wrangler deploy --env staging
[env.staging]
name = "hushare-staging"

[[env.staging.routes]]
pattern = "staging.hushare.space/*"
zone_name = "hushare.space"

[env.staging.assets]
directory = ".open-next/assets"
binding = "ASSETS"

# A DIFFERENT BUCKET. This single line is the difference between a safe staging environment and one
# that deletes production photos during a deletion test.
[[env.staging.r2_buckets]]
binding = "R2_BUCKET"
bucket_name = "hushare-media-staging"

[[env.staging.analytics_engine_datasets]]
binding = "ANALYTICS"
dataset = "Hushare_events_staging"

[[env.staging.ratelimits]]
name = "STREAM_RELAY_LIMITER"
namespace_id = "2001"
  [env.staging.ratelimits.simple]
  limit = 600
  period = 60

[[env.staging.ratelimits]]
name = "SUPPORT_CHAT_LIMITER"
namespace_id = "2002"
  [env.staging.ratelimits.simple]
  limit = 100
  period = 60

[env.staging.ai]
binding = "AI"

[env.staging.vars]
# Read by src/lib/server/environment.ts. Without it a staging deploy believes it is production and
# every isolation check below goes unenforced.
HUSHARE_ENV = "staging"
NEXT_PUBLIC_SITE_URL = "https://staging.hushare.space"
# Replace with the staging Supabase project's URL and anon key once it exists. Left as obvious
# placeholders rather than production's values: a placeholder fails immediately and visibly, and a
# copied production URL fails silently by working.
NEXT_PUBLIC_SUPABASE_URL = "https://REPLACE-WITH-STAGING-REF.supabase.co"
NEXT_PUBLIC_SUPABASE_ANON_KEY = "REPLACE-WITH-STAGING-ANON-KEY"
NEXT_PUBLIC_TURNSTILE_SITE_KEY = "1x00000000000000000000AA"  # Cloudflare's always-passes test key
R2_PUBLIC_HOST = "media-staging.hushare.space"
R2_BUCKET_NAME = "hushare-media-staging"
RESEND_DOMAIN_VERIFIED = "false"   # staging must never send mail to a real address
# Secrets are set separately and are NOT shared with production:
#   npx wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env staging
# ...and so on for every secret listed at the top of this file. A staging deploy holding
# production's service-role key can read and delete every real album regardless of the URL it uses.
